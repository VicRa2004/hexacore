# Pensado para Dokploy: la BD es un servicio aparte de Dokploy y el dominio se
# asigna desde su panel (Traefik). Un solo contenedor sirve la API (/api) y el frontend.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 caracteres)}
    APP_URL: ${APP_URL:?Define APP_URL (dominio público, base de los enlaces de los correos)}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    PORT: 3000
    # Solo se llega a `app` a través de Traefik: el rate limit usa su X-Forwarded-For.
    TRUST_PROXY: ${TRUST_PROXY:-true}

services:
  # Aplica las migraciones pendientes en cada deploy y termina. `migrate deploy`
  # nunca resetea ni borra datos; si falla, `app` no arranca.
  migrate:
    <<: *app
    restart: "no"
    command: ["bun", "--bun", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    # Liveness (/health, sin BD). /ready comprueba además Postgres.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
