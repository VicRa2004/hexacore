# Pensado para Dokploy: la BD es un servicio aparte de Dokploy y el dominio se
# asigna desde su panel (Traefik). Un solo contenedor sirve la API (/api) y el frontend.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      # La web lleva el DSN compilado (público por diseño: solo permite enviar eventos).
      VITE_SENTRY_DSN: ${SENTRY_DSN:-}
      VITE_OTEL_ENABLED: ${VITE_OTEL_ENABLED:-}
  environment:
    DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 caracteres)}
    TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    APP_URL: ${APP_URL:?Define APP_URL (dominio público, base de los enlaces de los correos)}
    # Login con Google/GitHub: cada proveedor se activa con su client id y secret.
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    # Con S3_BUCKET los archivos van a S3/R2; si no, al volumen `uploads`.
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_REGION: ${S3_REGION:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hexacore}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    PORT: 3000
    # Solo se llega a `app` a través de Traefik: el rate limit usa su X-Forwarded-For.
    TRUST_PROXY: ${TRUST_PROXY:-true}

services:
  # Aplica las migraciones pendientes en cada deploy y termina. `migrate deploy`
  # nunca resetea ni borra datos; si falla, `app` no arranca.
  migrate:
    <<: *app
    restart: "no"
    command: ["bun", "--bun", "node_modules/prisma/build/index.js", "migrate", "deploy"]

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    volumes:
      - uploads:/app/backend/uploads
    # Liveness (/health, sin BD). /ready comprueba además Postgres.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  uploads:
