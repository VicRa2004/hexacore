<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Hexacore</title>
		<script>
			// Antes de pintar, para no parpadear: misma lógica que src/core/tema.ts.
			(() => {
				let tema = null;
				try {
					tema = localStorage.getItem("tema");
				} catch {}
				const oscuro =
					tema === "oscuro" ||
					(tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
				// Tono de marca elegido (mismos valores que ACENTOS de src/core/tema.ts).
				const tonos = { indigo: 277, violeta: 300, azul: 250, cian: 215, esmeralda: 160, rosa: 350 };
				let acento = null;
				try {
					acento = localStorage.getItem("acento");
				} catch {}
				if (acento in tonos)
					document.documentElement.style.setProperty("--marca-h", tonos[acento]);
			})();
		</script>
	</head>
	<body class="h-full antialiased">
		<div id="root" class="h-full flex flex-col"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
